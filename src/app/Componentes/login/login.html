<form [formGroup]="form" (ngSubmit)="handleLogin()">
<fieldset>
<label for="correo">Correo: </label>
<input type="text" id="correo" placeholder="Ingrese su correo" formControlName="correo">
@if(getcorreo().hasError('required')&&(getcorreo().dirty||getcorreo().touched)){
<span>El correo es requerido</span>
}

<label for="password">Contraseña: </label>
<input type="password"  id="password"  placeholder="Ingrese su Contraseña" formControlName="password">
@if(getpassword().dirty||getpassword().touched){
    @if(getpassword().hasError('required')){
        <span>La Contraseña es requerido</span>
    }

}

<button type="submit">Iniciar Sesion</button>
</fieldset>
</form>
